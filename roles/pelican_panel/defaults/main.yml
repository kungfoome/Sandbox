---
################################
# Basics
################################

pelican_panel_name: pelican

################################
# Paths
################################

pelican_panel_paths_folder: "{{ pelican_panel_name }}/panel"
pelican_panel_paths_location: "{{ server_appdata_path }}/{{ pelican_panel_paths_folder }}"
pelican_panel_paths_folders_list:
  - "{{ pelican_panel_paths_location }}"
  - "{{ pelican_panel_paths_location }}/config"
  - "{{ pelican_panel_paths_location }}/data"

################################
# Web
################################

pelican_panel_web_subdomain: "{{ pelican_panel_name }}"
pelican_panel_web_domain: "{{ user.domain }}"
pelican_panel_web_port: "80"
pelican_panel_web_url: "{{ 'https://' + (pelican_panel_web_subdomain + '.' + pelican_panel_web_domain
                if (pelican_panel_web_subdomain | length > 0)
                else pelican_panel_web_domain) }}"
pelican_panel_web_app_domain: "{{ (pelican_panel_web_subdomain + '.' + pelican_panel_web_domain
                if (pelican_panel_web_subdomain | length > 0)
                else pelican_panel_web_domain) }}"

################################
# DNS
################################

pelican_panel_dns_record: "{{ pelican_panel_web_subdomain }}"
pelican_panel_dns_zone: "{{ pelican_panel_web_domain }}"
pelican_panel_dns_proxy: "{{ dns.proxied }}"

################################
# Traefik
################################

pelican_panel_traefik_sso_middleware: "{{ traefik_default_sso_middleware }}"
pelican_panel_traefik_middleware_default: "{{ traefik_default_middleware }}"
pelican_panel_traefik_middleware_custom: ""
pelican_panel_traefik_certresolver: "{{ traefik_default_certresolver }}"
pelican_panel_traefik_enabled: true
pelican_panel_traefik_api_enabled: true
pelican_panel_traefik_api_endpoint: "PathPrefix(`/api`)"

################################
# Docker
################################

# Container
pelican_panel_docker_container: "{{ pelican_panel_name }}"

# Image
pelican_panel_docker_image_pull: true
pelican_panel_docker_image_tag: "latest"
pelican_panel_docker_image: "us-docker.pkg.dev/pelican-gcr/pelican/panel:{{ pelican_panel_docker_image_tag }}"

# Ports
pelican_panel_docker_ports_defaults: []
pelican_panel_docker_ports_custom: []
pelican_panel_docker_ports: "{{ pelican_panel_docker_ports_defaults
                         + pelican_panel_docker_ports_custom }}"

# Envs
pelican_panel_docker_envs_default:
  ADMIN_EMAIL: "{{ user.email }}"
  ADMIN_PASSWORD: "{{ user.pass }}"
  ADMIN_USERNAME: "{{ user.name }}"
  APP_DEBUG: "false"
  APP_ENV: "production"
  APP_URL: "{{ pelican_panel_web_url }}"
  CADDY_DOMAIN: "{{ pelican_panel_web_app_domain }}"
  CADDY_PORT: "80"
  MAIL_DRIVER: "log"
  PGID: "{{ gid }}"
  PUID: "{{ uid }}"
  TZ: "{{ tz }}"

pelican_panel_docker_envs_custom: {}
pelican_panel_docker_envs: "{{ pelican_panel_docker_envs_default
                        | combine(pelican_panel_docker_envs_custom) }}"

# Commands
pelican_panel_docker_commands_default: []
pelican_panel_docker_commands_custom: []
pelican_panel_docker_commands: "{{ pelican_panel_docker_commands_default
                           + pelican_panel_docker_commands_custom }}"

# Volumes
pelican_panel_docker_volumes_default:
  - "{{ pelican_panel_paths_location }}/config:/pelican/config"
  - "{{ pelican_panel_paths_location }}/data:/pelican/data"

pelican_panel_docker_volumes_custom: []
pelican_panel_docker_volumes: "{{ pelican_panel_docker_volumes_default
                           + pelican_panel_docker_volumes_custom }}"

# Devices
pelican_panel_docker_devices_default: []
pelican_panel_docker_devices_custom: []
pelican_panel_docker_devices: "{{ pelican_panel_docker_devices_default
                           + pelican_panel_docker_devices_custom }}"

# Hosts
pelican_panel_docker_hosts_default: {}
pelican_panel_docker_hosts_custom: {}
pelican_panel_docker_hosts: "{{ docker_hosts_common
                         | combine(pelican_panel_docker_hosts_default)
                         | combine(pelican_panel_docker_hosts_custom) }}"

# Labels
pelican_panel_docker_labels_default: {}
pelican_panel_docker_labels_custom: {}
pelican_panel_docker_labels: "{{ docker_labels_common
                          | combine(pelican_panel_docker_labels_default)
                          | combine(pelican_panel_docker_labels_custom) }}"

# Hostname
pelican_panel_docker_hostname: "{{ pelican_panel_name }}"

# Networks
pelican_panel_docker_networks_alias: "{{ pelican_panel_name }}"
pelican_panel_docker_networks_default: []
pelican_panel_docker_networks_custom: []
pelican_panel_docker_networks: "{{ docker_networks_common
                            + pelican_panel_docker_networks_default
                            + pelican_panel_docker_networks_custom }}"

# Capabilities
pelican_panel_docker_capabilities_default: []
pelican_panel_docker_capabilities_custom: []
pelican_panel_docker_capabilities: "{{ pelican_panel_docker_capabilities_default
                               + pelican_panel_docker_capabilities_custom }}"

# Security Opts
pelican_panel_docker_security_opts_default: []
pelican_panel_docker_security_opts_custom: []
pelican_panel_docker_security_opts: "{{ pelican_panel_docker_security_opts_default
                                + pelican_panel_docker_security_opts_custom }}"

# Restart Policy
pelican_panel_docker_restart_policy: unless-stopped

# State
pelican_panel_docker_state: started 
